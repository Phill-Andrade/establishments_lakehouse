name: CI

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install development tools
        run: python -m pip install poetry==2.4.1 ruff==0.11.13

      - name: Install project dependencies
        run: poetry install --only dev --no-interaction --no-root

      - name: Run Ruff
        run: ruff check src tests

      - name: Run unit tests
        run: poetry run pytest -s tests/unit

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLATFORM_IMAGE: ghcr.io/phill-andrade/hadoop-platform:0.1.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build pipeline image
        run: >-
          docker build
          --file docker/Dockerfile
          --build-arg PLATFORM_IMAGE=${PLATFORM_IMAGE}
          --tag establishments-lakehouse:ci
          .
